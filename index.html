<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QR Code Generator — Buat QR code dari link, teks, WiFi, atau email dengan opsi custom warna, logo, dot style, dan label. Gratis dan privat.">
    <title>QR Code MaR — Generator QR Code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>
    <!-- Animated Space Background -->
    <canvas id="space-bg"></canvas>

    <header class="header">
        <div class="logo">
            <div class="logo-icon">
                <img src="logo.png" alt="QR Code MaR Logo" width="36" height="36" style="border-radius: 6px;">
            </div>
            <span class="logo-text">QR Code <span class="logo-accent">MaR</span></span>
        </div>
        <p class="header-subtitle">Generate & customize QR codes instantly</p>
    </header>

    <main class="container">
        <div class="app-layout">
            <!-- Settings Panel -->
            <section class="panel settings-panel">
                <h2 class="panel-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    Settings
                </h2>

                <!-- Data Type Tabs -->
                <div class="input-group">
                    <label class="input-label">Data Type</label>
                    <div class="tab-group" id="data-type-tabs">
                        <button type="button" class="tab-btn active" data-type="url">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                            URL
                        </button>
                        <button type="button" class="tab-btn" data-type="text">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                            Text
                        </button>
                        <button type="button" class="tab-btn" data-type="wifi">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
                            WiFi
                        </button>
                        <button type="button" class="tab-btn" data-type="email">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            Email
                        </button>
                    </div>
                </div>

                <!-- URL Input -->
                <div class="input-group data-input" id="input-url">
                    <label for="url-input" class="input-label">URL / Link</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                        </svg>
                        <input type="url" id="url-input" placeholder="https://example.com" autocomplete="off" spellcheck="false">
                    </div>
                </div>

                <!-- Text Input -->
                <div class="input-group data-input" id="input-text" style="display:none;">
                    <label for="text-input" class="input-label">Text</label>
                    <textarea id="text-input" class="textarea-input" rows="3" placeholder="Enter any text here..."></textarea>
                </div>

                <!-- WiFi Inputs -->
                <div class="input-group data-input" id="input-wifi" style="display:none;">
                    <label for="wifi-ssid" class="input-label">Network Name (SSID)</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
                        <input type="text" id="wifi-ssid" placeholder="MyWiFiNetwork" autocomplete="off">
                    </div>
                    <label for="wifi-password" class="input-label" style="margin-top:10px;">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="text" id="wifi-password" placeholder="Password123" autocomplete="off">
                    </div>
                    <label for="wifi-encryption" class="input-label" style="margin-top:10px;">Encryption</label>
                    <div class="select-wrapper">
                        <select id="wifi-encryption">
                            <option value="WPA">WPA/WPA2</option>
                            <option value="WEP">WEP</option>
                            <option value="nopass">None (Open)</option>
                        </select>
                    </div>
                </div>

                <!-- Email Inputs -->
                <div class="input-group data-input" id="input-email" style="display:none;">
                    <label for="email-to" class="input-label">Email Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <input type="email" id="email-to" placeholder="hello@example.com" autocomplete="off">
                    </div>
                    <label for="email-subject" class="input-label" style="margin-top:10px;">Subject</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
                        <input type="text" id="email-subject" placeholder="Email subject" autocomplete="off">
                    </div>
                    <label for="email-body" class="input-label" style="margin-top:10px;">Body</label>
                    <textarea id="email-body" class="textarea-input" rows="2" placeholder="Email body..."></textarea>
                </div>

                <!-- Error Correction -->
                <div class="input-group">
                    <label for="ec-level" class="input-label">Error Correction Level</label>
                    <div class="select-wrapper">
                        <select id="ec-level">
                            <option value="L">L — Low (7%)</option>
                            <option value="M">M — Medium (15%)</option>
                            <option value="Q">Q — Quartile (25%)</option>
                            <option value="H" selected>H — High (30%) ★ Recommended for logos</option>
                        </select>
                    </div>
                </div>

                <!-- Dot Style -->
                <div class="input-group">
                    <label class="input-label">Dot Style</label>
                    <div class="dot-style-group" id="dot-style-group">
                        <button type="button" class="dot-style-btn active" data-style="square" title="Square">
                            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="currentColor"/></svg>
                        </button>
                        <button type="button" class="dot-style-btn" data-style="rounded" title="Rounded">
                            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4" fill="currentColor"/></svg>
                        </button>
                        <button type="button" class="dot-style-btn" data-style="dots" title="Circle">
                            <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>
                        </button>
                        <button type="button" class="dot-style-btn" data-style="diamond" title="Diamond">
                            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="4" width="11.3" height="11.3" rx="1" fill="currentColor" transform="rotate(45 12 12)"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Color Presets -->
                <div class="input-group">
                    <label class="input-label">Color Presets</label>
                    <div class="preset-group" id="preset-group">
                        <button type="button" class="preset-btn active" data-fg="#000000" data-bg="#ffffff" title="Classic">
                            <span class="preset-swatch" style="background:#000000; border: 2px solid #ffffff;"></span>
                        </button>
                        <button type="button" class="preset-btn" data-fg="#1a1a2e" data-bg="#e8e8f0" title="Midnight">
                            <span class="preset-swatch" style="background: linear-gradient(135deg, #1a1a2e, #16213e);"></span>
                        </button>
                        <button type="button" class="preset-btn" data-fg="#0f3460" data-bg="#e0f7fa" title="Ocean">
                            <span class="preset-swatch" style="background: linear-gradient(135deg, #0f3460, #1a73e8);"></span>
                        </button>
                        <button type="button" class="preset-btn" data-fg="#6d28d9" data-bg="#faf5ff" title="Purple">
                            <span class="preset-swatch" style="background: linear-gradient(135deg, #6d28d9, #a855f7);"></span>
                        </button>
                        <button type="button" class="preset-btn" data-fg="#065f46" data-bg="#ecfdf5" title="Emerald">
                            <span class="preset-swatch" style="background: linear-gradient(135deg, #065f46, #10b981);"></span>
                        </button>
                        <button type="button" class="preset-btn" data-fg="#9f1239" data-bg="#fff1f2" title="Rose">
                            <span class="preset-swatch" style="background: linear-gradient(135deg, #9f1239, #f43f5e);"></span>
                        </button>
                        <button type="button" class="preset-btn" data-fg="#f59e0b" data-bg="#1a1a2e" title="Gold Dark">
                            <span class="preset-swatch" style="background: linear-gradient(135deg, #f59e0b, #d97706);"></span>
                        </button>
                        <button type="button" class="preset-btn" data-fg="#ffffff" data-bg="#000000" title="Inverted">
                            <span class="preset-swatch" style="background:#ffffff; border: 2px solid #333;"></span>
                        </button>
                    </div>
                </div>

                <!-- Colors -->
                <div class="input-group">
                    <label class="input-label">Custom Colors</label>
                    <div class="color-row">
                        <div class="color-field">
                            <label for="fg-color" class="color-label">Foreground</label>
                            <div class="color-picker-wrapper">
                                <input type="color" id="fg-color" value="#000000">
                                <span class="color-hex" id="fg-hex">#000000</span>
                            </div>
                        </div>
                        <div class="color-field">
                            <label for="bg-color" class="color-label">Background</label>
                            <div class="color-picker-wrapper">
                                <input type="color" id="bg-color" value="#ffffff">
                                <span class="color-hex" id="bg-hex">#ffffff</span>
                            </div>
                        </div>
                    </div>
                    <div class="checkbox-group" style="margin-top: 10px;">
                        <input type="checkbox" id="transparent-bg">
                        <label for="transparent-bg">Transparent background (PNG only)</label>
                    </div>
                </div>

                <!-- QR Size -->
                <div class="input-group">
                    <label for="qr-size" class="input-label">QR Size: <span id="qr-size-value">512</span>px</label>
                    <input type="range" id="qr-size" min="200" max="1024" value="512" step="8">
                </div>

                <!-- Margin -->
                <div class="input-group">
                    <label for="qr-margin" class="input-label">Margin: <span id="qr-margin-value">2</span> modules</label>
                    <input type="range" id="qr-margin" min="0" max="6" value="2" step="1">
                </div>

                <hr class="divider">

                <!-- Logo Section -->
                <div class="input-group">
                    <label class="input-label">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                        Logo (Optional)
                    </label>
                    <div class="file-upload-area" id="logo-drop-area">
                        <input type="file" id="logo-input" accept="image/*" hidden>
                        <div class="file-upload-content" id="upload-content">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            <p>Click or drag image here</p>
                            <span class="file-hint">PNG, JPG, SVG — Max 2MB</span>
                        </div>
                        <div class="file-preview" id="logo-preview" style="display:none;">
                            <img id="logo-preview-img" alt="Logo preview">
                            <button type="button" class="remove-logo-btn" id="remove-logo-btn" title="Remove logo">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"/>
                                    <line x1="6" y1="6" x2="18" y2="18"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Logo Options -->
                <div class="input-group logo-options" id="logo-options" style="display:none;">
                    <label for="logo-size" class="input-label">Logo Size: <span id="logo-size-value">25</span>%</label>
                    <input type="range" id="logo-size" min="10" max="35" value="25" step="1">

                    <label for="logo-padding" class="input-label" style="margin-top: 12px;">Logo Padding: <span id="logo-padding-value">8</span>px</label>
                    <input type="range" id="logo-padding" min="0" max="20" value="8" step="1">

                    <div class="checkbox-group" style="margin-top: 12px;">
                        <input type="checkbox" id="logo-round" checked>
                        <label for="logo-round">Rounded logo background</label>
                    </div>
                </div>

                <hr class="divider">

                <!-- Label / Frame -->
                <div class="input-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="show-label">
                        <label for="show-label">Add "Scan Me" label below QR</label>
                    </div>
                </div>
                <div class="input-group" id="label-options" style="display:none;">
                    <label for="label-text" class="input-label">Label Text</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                        <input type="text" id="label-text" value="Scan Me" placeholder="Scan Me" autocomplete="off">
                    </div>
                </div>

                <!-- Generate Button -->
                <button type="button" class="btn-generate" id="generate-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="8" height="8" rx="1"/>
                        <rect x="14" y="2" width="8" height="8" rx="1"/>
                        <rect x="2" y="14" width="8" height="8" rx="1"/>
                        <rect x="14" y="14" width="4" height="4" rx="0.5"/>
                    </svg>
                    Generate QR Code
                </button>
            </section>

            <!-- Preview Panel -->
            <section class="panel preview-panel">
                <h2 class="panel-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    Preview
                </h2>

                <div class="preview-area" id="preview-area">
                    <div class="preview-placeholder" id="preview-placeholder">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
                            <rect x="2" y="2" width="8" height="8" rx="1"/>
                            <rect x="14" y="2" width="8" height="8" rx="1"/>
                            <rect x="2" y="14" width="8" height="8" rx="1"/>
                            <rect x="14" y="14" width="4" height="4" rx="0.5"/>
                            <line x1="22" y1="14" x2="22" y2="18"/>
                            <line x1="18" y1="22" x2="22" y2="22"/>
                        </svg>
                        <p>Enter data and click <strong>Generate</strong></p>
                    </div>
                    <canvas id="qr-canvas" style="display:none;"></canvas>
                </div>

                <div class="download-actions" id="download-actions" style="display:none;">
                    <button type="button" class="btn-download" id="download-png-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        PNG
                    </button>
                    <button type="button" class="btn-download btn-download-copy" id="copy-btn" title="Copy to clipboard">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                        Copy
                    </button>
                    <button type="button" class="btn-download btn-download-secondary" id="download-svg-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        SVG
                    </button>
                </div>

                <!-- History Section -->
                <div class="history-section" id="history-section">
                    <h3 class="history-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        Recent QR Codes
                        <button type="button" class="clear-history-btn" id="clear-history-btn" title="Clear history">Clear</button>
                    </h3>
                    <div class="history-grid" id="history-grid">
                        <p class="history-empty" id="history-empty">No history yet</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <p>Built with ❤️ by <strong>MaR</strong> — QR codes generated client-side, no data sent to any server.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="space-bg.js"></script>
    <script src="script.js"></script>
</body>
</html>
